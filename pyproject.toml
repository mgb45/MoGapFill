[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mogapfill"
version = "0.1.0"
description = "Low-dimensional Kalman smoother for filling gaps in motion capture marker trajectories"
readme = "README.md"
license = "MIT"
authors = [{ name = "Michael Burke" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "ezc3d>=1.5",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/mgb45/MoGapFill"

[tool.hatch.build.targets.wheel]
packages = ["src/mogapfill"]

[tool.ruff]
line-length = 100
target-version = "py39"
